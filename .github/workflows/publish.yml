name: "publish"

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare release notes from changelog
        id: release-notes
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require("fs");
            const { version } = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8").split(/\r?\n/);
            const start = changelog.findIndex(line => line.startsWith(`## [${version}]`));

            if (start === -1) {
              throw new Error(`No CHANGELOG.md section found for version ${version}`);
            }

            let end = changelog.findIndex((line, index) => index > start && /^##\s/.test(line));
            if (end === -1) end = changelog.length;

            const notes = changelog.slice(start + 1, end).join("\n").trim();
            if (!notes) {
              throw new Error(`CHANGELOG.md section for version ${version} is empty`);
            }

            core.setOutput("body", `${notes}\n\nSee the assets to download this version and install.`);

      - name: Build and Publish Tauri App
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: crewmateinia350-v__VERSION__
          releaseName: "CrewmateINIA350 v__VERSION__"
          releaseBody: ${{ steps.release-notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: "Debug: list release assets"
        uses: actions/github-script@v6
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            console.log('Latest release tag:', release.data.tag_name);
            console.log('Assets:');
            for (const a of release.data.assets) {
              console.log(`${a.name} -> ${a.browser_download_url}`);
            }